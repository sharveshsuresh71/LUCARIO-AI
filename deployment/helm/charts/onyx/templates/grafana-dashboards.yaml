{{- if .Values.monitoring.grafana.dashboards.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lucario.resourceName" (list . "indexing-pipeline-dashboard") }}
  labels:
    {{- include "lucario.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "LUCARIO"
data:
  lucario-indexing-pipeline.json: |
    {{- .Files.Get "dashboards/indexing-pipeline.json" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lucario.resourceName" (list . "opensearch-search-latency-dashboard") }}
  labels:
    {{- include "lucario.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "LUCARIO"
data:
  lucario-opensearch-search-latency.json: |
    {{- .Files.Get "dashboards/opensearch-search-latency.json" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lucario.resourceName" (list . "redis-queues-dashboard") }}
  labels:
    {{- include "lucario.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "LUCARIO"
data:
  lucario-redis-queues.json: |
    {{- .Files.Get "dashboards/redis-queues.json" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lucario.resourceName" (list . "indexing-pruning-dashboard") }}
  labels:
    {{- include "lucario.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "LUCARIO"
data:
  lucario-indexing-pruning.json: |
    {{- .Files.Get "dashboards/indexing-pruning.json" | nindent 4 }}
{{- end }}
