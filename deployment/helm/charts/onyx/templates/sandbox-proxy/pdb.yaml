{{- if and (eq (include "lucario.craftEnabled" .) "true") (gt (int ((.Values.sandboxProxy | default dict).replicaCount | default 1)) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "lucario.resourceName" (list . "sandbox-proxy") }}
  labels:
    {{- include "lucario.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-proxy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "lucario.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sandbox-proxy
{{- end }}
