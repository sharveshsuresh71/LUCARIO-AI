{{- if eq (include "lucario.craftEnabled" .) "true" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lucario.resourceName" (list . "sandbox-proxy") }}
  labels:
    {{- include "lucario.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-proxy
spec:
  type: ClusterIP
  selector:
    {{- include "lucario.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-proxy
  ports:
    - name: proxy
      port: {{ include "lucario.sandboxProxyPort" . }}
      targetPort: proxy
      protocol: TCP
{{- end }}
